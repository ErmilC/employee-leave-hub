services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: leavehub-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    volumes:
      - ./backend/data:/app/data
      - ./backend/uploads:/app/uploads
    restart: "no"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: leavehub-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: "no"
